server.port=8080

spring.datasource.url=jdbc:h2:file:./gridwatch-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local Ollama (fallback generation + default offline embedding provider)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embed-model=${OLLAMA_EMBED_MODEL:nomic-embed-text}
ollama.chat-model=${OLLAMA_CHAT_MODEL:phi3}

# NVIDIA hosted OpenAI-compatible endpoint
nvidia.api-key=${NVIDIA_API_KEY:}
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
nvidia.chat-model=${NVIDIA_CHAT_MODEL:openai/gpt-oss-20b}
nvidia.embed-model=${NVIDIA_EMBED_MODEL:nvidia/llama-3.2-nv-embedqa-1b-v2}

# nvidia-with-fallback | nvidia-only | ollama-only
llm.mode=${LLM_MODE:nvidia-with-fallback}
# ollama is the default so the RAG vector space stays local and deterministic.
# nvidia is available as an explicit option after validating the NVIDIA embedding endpoint.
# auto also probes NVIDIA once at startup, then keeps the selected provider stable.
llm.embedding-provider=${LLM_EMBEDDING_PROVIDER:ollama}

# UDP LAN discovery for the ESP8266 gateway (avoids a hard-coded laptop IP)
gridwatch.discovery-port=${GRIDWATCH_DISCOVERY_PORT:30303}
